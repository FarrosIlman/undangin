<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Generator - Malika Joki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #1a1d1a; color: #F7F1E6; font-family: sans-serif; }
  </style>
</head>
<body class="p-8">
  <div class="max-w-2xl mx-auto bg-[#232723] p-8 rounded-xl shadow-2xl border border-[#B78E4F]/30">
    <h1 class="text-3xl font-bold text-[#B78E4F] mb-2">Auto-Generator Link Undangan</h1>
    <p class="text-white/70 mb-6 text-sm">Tool rahasia khusus admin @malika.joki untuk mempercepat pembuatan link blast WhatsApp.</p>
    
    <div class="mb-4">
      <label class="block text-sm font-bold text-[#B78E4F] mb-2">1. Masukkan Domain / Link Utama</label>
      <input type="text" id="domain" value="https://domain-klien.com/" class="w-full bg-[#1a1d1a] border border-[#B78E4F]/30 rounded px-4 py-2 text-white focus:outline-none focus:border-[#B78E4F]" placeholder="https://domain-klien.com/">
      <p class="text-xs text-white/40 mt-1">Ganti dengan domain asli website undangan saat sudah online.</p>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-bold text-[#B78E4F] mb-2">2. Daftar Nama Tamu (Satu baris = Satu nama)</label>
      <textarea id="guestList" rows="8" class="w-full bg-[#1a1d1a] border border-[#B78E4F]/30 rounded px-4 py-2 text-white focus:outline-none focus:border-[#B78E4F]" placeholder="Bapak Budi&#10;Keluarga H. Udin&#10;Siti Markonah"></textarea>
    </div>

    <button onclick="generateLinks()" class="w-full bg-[#B78E4F] hover:bg-[#8A6A34] text-white font-bold py-3 rounded transition-colors mb-6">
      GENERATE LINKS
    </button>

    <div class="mb-4">
      <div class="flex justify-between items-end mb-2">
        <label class="block text-sm font-bold text-[#B78E4F]">3. Hasil Link (Siap Copy)</label>
        <button onclick="copyResults()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded transition-colors">Copy Semua</button>
      </div>
      <textarea id="result" rows="10" readonly class="w-full bg-[#1a1d1a] border border-[#B78E4F]/30 rounded px-4 py-2 text-[#B78E4F] focus:outline-none"></textarea>
    </div>
  </div>

  <script>
    function generateLinks() {
      let domain = document.getElementById('domain').value.trim();
      const guestList = document.getElementById('guestList').value.split('\n');
      const resultBox = document.getElementById('result');
      
      if(!domain.endsWith('/') && !domain.endsWith('.html')) {
        domain += '/';
      }

      let results = [];
      guestList.forEach(name => {
        name = name.trim();
        if(name) {
          // Encrypt nama menggunakan Base64 (mendukung karakter khusus)
          const encodedName = btoa(unescape(encodeURIComponent(name)));
          const finalLink = `${domain}?to=${encodedName}`;
          results.push(`${name}\n${finalLink}\n`);
        }
      });

      resultBox.value = results.join('\n');
    }

    function copyResults() {
      const resultBox = document.getElementById('result');
      resultBox.select();
      document.execCommand('copy');
      alert('Semua link berhasil disalin!');
    }
  </script>
</body>
</html>
